<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json">
<title>Stok Minuman Online</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f6f7;color:#172126}header{background:#0f766e;color:white;padding:16px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:21px}.userbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:6px;font-size:13px}.userbar button{background:#fff;color:#0f766e;padding:7px 10px}nav{display:flex;gap:7px;overflow:auto;padding:10px;background:white;position:sticky;top:78px;z-index:4;border-bottom:1px solid #ddd}button{border:0;border-radius:10px;padding:10px 13px;background:#0f766e;color:#fff;font-weight:650;cursor:pointer}nav button{background:#e8eeee;color:#17403d;white-space:nowrap}nav button.active{background:#0f766e;color:white}main{padding:14px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.card,.form{background:white;border-radius:14px;padding:14px;box-shadow:0 1px 5px #0001;margin-bottom:14px}.big{font-size:24px;font-weight:800}table{width:100%;border-collapse:collapse;background:white}.tablewrap{overflow:auto;border-radius:12px}th,td{padding:10px;border-bottom:1px solid #e8eeee;text-align:left;white-space:nowrap}th{background:#edf4f3}input,select{width:100%;padding:10px;border:1px solid #cbd5d6;border-radius:9px;background:white}label{font-size:13px;font-weight:700;display:block;margin:8px 0 5px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.muted{color:#667}.low{color:#b42318;font-weight:700}.ok{color:#087443;font-weight:700}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.pill{padding:4px 8px;border-radius:20px;background:#e8eeee;font-size:12px}.danger{background:#b42318}.secondary{background:#e8eeee;color:#17403d}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:white;border-radius:18px;padding:22px;box-shadow:0 2px 12px #0002}.loginbox h1{margin-top:0}.hidden{display:none!important}.status{padding:10px;border-radius:10px;background:#eef7f6;margin-bottom:12px}.right{text-align:right}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><h1>📦 Stok Minuman</h1><p class="muted">Login Admin / Karyawan</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button style="width:100%;margin-top:14px">Masuk</button></form><p id="loginMsg" class="muted"></p></div></div>
<div id="appShell" class="hidden">
<header><h1>📦 Stok Minuman</h1><div class="userbar"><span id="userLine">Terhubung ke database online</span><button onclick="logout()">Keluar</button></div></header>
<nav id="nav"></nav><main id="app"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://dtkxqmieusoalgaqqvqg.supabase.co';
const SUPABASE_KEY='sb_publishable_mxwJCOFMQCyJuTBfcyW2wA_gGETE7YT';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentProfile=null,page='dashboard',products=[],stocks=[];
const navItems=[['dashboard','Dashboard'],['sale','Penjualan'],['in','Barang Masuk'],['move','Pindah Stok'],['out','Pengeluaran'],['stock','Stok'],['history','Riwayat'],['produk','⚙️ Kelola Barang']];
const money=n=>n==null?'—':'Rp '+Number(n).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function stockOf(p,l){const x=stocks.find(s=>s.product_id===p.id&&s.lokasi===l);return x?Number(x.jumlah):0}
function totalOf(p){return stockOf(p,'gudang')+stockOf(p,'etalase')}
function opts(){return products.filter(p=>p.aktif).map(p=>`<option value="${p.id}">${esc(p.nama)}</option>`).join('')}
async function refreshData(){
 const [pr,st]=await Promise.all([sb.from('products').select('*').order('nama'),sb.from('stock').select('*')]);
 if(pr.error)throw pr.error;if(st.error)throw st.error;products=pr.data||[];stocks=st.data||[];
}
async function boot(){
 const {data:{session}}=await sb.auth.getSession(); if(session) await enterApp(session.user); else showLogin();
 sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT')showLogin();});
}
function showLogin(){document.getElementById('login').classList.remove('hidden');document.getElementById('appShell').classList.add('hidden')}
async function enterApp(user){
 currentUser=user;const r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
 if(r.error){alert(r.error.message);return}currentProfile=r.data;
 if(!currentProfile||!currentProfile.aktif){await sb.auth.signOut();alert('Akun tidak aktif.');return}
 await refreshData();document.getElementById('login').classList.add('hidden');document.getElementById('appShell').classList.remove('hidden');
 document.getElementById('userLine').textContent=`${currentProfile.nama} · ${currentProfile.role}`;render();
}
async function logout(){await sb.auth.signOut()}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('loginMsg');msg.textContent='Memeriksa login...';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});msg.textContent=error?error.message:'';});
function renderNav(){document.getElementById('nav').innerHTML=navItems.filter(x=>x[0]!=='produk'||currentProfile?.role==='admin').map(x=>`<button class="${page===x[0]?'active':''}" onclick="page='${x[0]}';render()">${x[1]}</button>`).join('')}
async function render(){renderNav();let a=document.getElementById('app');try{await refreshData();if(page==='dashboard')a.innerHTML=dashboard();if(page==='stock')a.innerHTML=stock();if(page==='sale')a.innerHTML=sale();if(page==='in')a.innerHTML=inPage();if(page==='move')a.innerHTML=move();if(page==='out')a.innerHTML=outPage();if(page==='history')a.innerHTML=await history();if(page==='produk')a.innerHTML=productPage();}catch(e){a.innerHTML=`<div class="card"><b>Gagal memuat data</b><p>${esc(e.message)}</p></div>`}}
function dashboard(){const today=new Date().toISOString().slice(0,10);return `<h2>Dashboard</h2><div class="grid"><div class="card"><small>Omzet hari ini</small><div class="big" id="omzet">Memuat...</div></div><div class="card"><small>Total jenis barang</small><div class="big">${products.filter(p=>p.aktif).length}</div></div><div class="card"><small>Total unit stok</small><div class="big">${products.reduce((x,p)=>x+totalOf(p),0)}</div></div><div class="card"><small>Stok menipis</small><div class="big low">${products.filter(p=>p.aktif&&totalOf(p)<=p.minimum_stok).length}</div></div></div><div class="card"><b>Stok menipis</b>${products.filter(p=>p.aktif&&totalOf(p)<=p.minimum_stok).map(p=>`<div class="item"><span>${esc(p.nama)}</span><b>${totalOf(p)}</b></div>`).join('')||'<p class="muted">Tidak ada.</p>'}</div></div><script>loadOmzet('${today}')<\/script>`}
async function loadOmzet(today){const from=today+'T00:00:00';const {data,error}=await sb.from('sales').select('total,created_at').gte('created_at',from);const el=document.getElementById('omzet');if(el)el.textContent=error?'—':money((data||[]).reduce((s,x)=>s+Number(x.total),0))}
function stock(){return `<h2>Stok</h2><div class="tablewrap"><table><tr><th>Barang</th><th>Gudang</th><th>Etalase</th><th>Total</th><th>Satuan</th><th>Status</th></tr>${products.filter(p=>p.aktif).map(p=>{let t=totalOf(p);return `<tr><td>${esc(p.nama)}</td><td>${stockOf(p,'gudang')}</td><td>${stockOf(p,'etalase')}</td><td><b>${t}</b></td><td>${p.isi_karton?`1 karton=${p.isi_karton} pcs`:'pcs'}</td><td>${t<=p.minimum_stok?'<span class="low">Menipis</span>':'<span class="ok">Aman</span>'}</td></tr>`}).join('')}</table></div>`}
function sale(){return `<h2>Penjualan / Buat Nota</h2><div class="form"><div class="row"><div><label>Barang</label><select id="sp">${opts()}</select></div><div><label>Sumber stok</label><select id="sl"><option value="etalase">Etalase</option><option value="gudang">Gudang</option></select></div><div><label>Satuan</label><select id="su"><option value="pcs">Pcs</option><option value="carton">Karton</option></select></div><div><label>Jumlah</label><input id="sq" type="number" min="1" value="1"></div></div><label>Nomor nota</label><input id="sn" placeholder="Otomatis jika dikosongkan"><p class="muted">Karton otomatis dikonversi ke pcs. Harga jual per pcs.</p><button onclick="doSale()">Simpan Penjualan</button></div>`}
async function doSale(){const p=products.find(x=>x.id===sp.value),q=Number(sq.value),unit=su.value,loc=sl.value,n=unit==='carton'?q*Number(p.isi_karton||0):q;if(!p||n<1||n>stockOf(p,loc))return alert('Stok tidak cukup atau konversi karton belum diatur.');if(p.harga_jual==null)return alert('Harga jual belum diisi.');const nota=sn.value.trim()||('NOTA-'+Date.now());const {error}=await sb.rpc('record_sale',{p_product_id:p.id,p_sumber:loc,p_jumlah_pcs:n,p_mode:unit,p_jumlah_input:q,p_harga:p.harga_jual,p_nomor_nota:nota});if(error)return alert(error.message);alert('Penjualan tersimpan.');page='history';render()}
function inPage(){return `<h2>Barang Masuk</h2><div class="form"><div class="row"><div><label>Barang</label><select id="ip">${opts()}</select></div><div><label>Jumlah</label><input id="iq" type="number" min="1" value="1"></div><div><label>Satuan</label><select id="iu"><option value="carton">Karton</option><option value="pcs">Pcs</option></select></div><div><label>Supplier (opsional)</label><input id="isup" placeholder="Nama supplier"></div></div><p class="muted">Semua barang masuk dari supplier otomatis masuk Gudang.</p><button onclick="doIn()">Simpan Barang Masuk</button></div>`}
async function doIn(){const p=products.find(x=>x.id===ip.value),q=Number(iq.value),unit=iu.value,n=unit==='carton'?q*Number(p.isi_karton||0):q;if(!p||n<1)return alert('Jumlah/isi karton tidak valid.');const {error}=await sb.rpc('record_incoming',{p_product_id:p.id,p_jumlah_pcs:n,p_mode:unit,p_jumlah_input:q,p_supplier:isup.value.trim()||null});if(error)return alert(error.message);alert('Barang masuk tersimpan di Gudang.');render()}
function move(){return `<h2>Pindah Stok</h2><div class="form"><div class="row"><div><label>Barang</label><select id="mp">${opts()}</select></div><div><label>Dari</label><select id="mf"><option value="gudang">Gudang</option><option value="etalase">Etalase</option></select></div><div><label>Ke</label><select id="mt"><option value="etalase">Etalase</option><option value="gudang">Gudang</option></select></div><div><label>Jumlah pcs</label><input id="mq" type="number" min="1" value="1"></div></div><button onclick="doMove()">Pindahkan</button></div>`}
async function doMove(){const p=products.find(x=>x.id===mp.value),q=Number(mq.value);if(!p||q<1||mf.value===mt.value||q>stockOf(p,mf.value))return alert('Data perpindahan tidak valid.');const {error}=await sb.rpc('record_transfer',{p_product_id:p.id,p_dari:mf.value,p_ke:mt.value,p_jumlah_pcs:q});if(error)return alert(error.message);alert('Stok dipindahkan.');render()}
function outPage(){return `<h2>Pengeluaran Barang (Tanpa Penjualan)</h2><div class="form"><div class="row"><div><label>Barang</label><select id="op">${opts()}</select></div><div><label>Dari</label><select id="ol"><option value="gudang">Gudang</option><option value="etalase">Etalase</option></select></div><div><label>Jumlah pcs</label><input id="oq" type="number" min="1" value="1"></div><div><label>Alasan</label><select id="or"><option>Diambil Owner</option><option>Gratis / Giveaway</option><option>Dipakai Sendiri</option><option>Rusak</option><option>Lainnya</option></select></div></div><label>Keterangan</label><input id="oket" placeholder="Opsional"><p class="muted">Tidak dihitung sebagai omzet.</p><button onclick="doOut()">Simpan Pengeluaran</button></div>`}
async function doOut(){const p=products.find(x=>x.id===op.value),q=Number(oq.value);if(!p||q<1||q>stockOf(p,ol.value))return alert('Stok tidak cukup.');const {error}=await sb.rpc('record_issue',{p_product_id:p.id,p_sumber:ol.value,p_jumlah_pcs:q,p_alasan:or.value,p_keterangan:oket.value.trim()||null});if(error)return alert(error.message);alert('Pengeluaran tersimpan dan tidak masuk omzet.');render()}
async function history(){const [s,i,t,o]=await Promise.all([sb.from('sales').select('*,sale_items(*,products(nama))').order('created_at',{ascending:false}).limit(50),sb.from('incoming').select('*,incoming_items(*,products(nama))').order('created_at',{ascending:false}).limit(50),sb.from('stock_transfers').select('*,stock_transfer_items(*,products(nama))').order('created_at',{ascending:false}).limit(50),sb.from('stock_issues').select('*,stock_issue_items(*,products(nama))').order('created_at',{ascending:false}).limit(50)]);let rows=[];(s.data||[]).forEach(x=>rows.push({d:x.created_at,type:'Penjualan',text:`Nota ${esc(x.nomor_nota)} · ${money(x.total)}`}));(i.data||[]).forEach(x=>rows.push({d:x.created_at,type:'Barang Masuk',text:`Supplier: ${esc(x.supplier||'-')}`}));(t.data||[]).forEach(x=>rows.push({d:x.created_at,type:'Pindah Stok',text:`${esc(x.dari)} → ${esc(x.ke)}`}));(o.data||[]).forEach(x=>rows.push({d:x.created_at,type:'Pengeluaran',text:`${esc(x.alasan)} · ${esc(x.keterangan||'')}`}));rows.sort((a,b)=>new Date(b.d)-new Date(a.d));return `<h2>Riwayat Aktivitas</h2><div class="card">${rows.slice(0,100).map(x=>`<div class="item"><div><b>${x.type}</b><br>${x.text}<br><small>${new Date(x.d).toLocaleString('id-ID')}</small></div></div>`).join('')||'<p class="muted">Belum ada aktivitas.</p>'}</div>`}
function productPage(){if(currentProfile?.role!=='admin')return '<div class="card"><b>Akses ditolak.</b></div>';return `<h2>⚙️ Kelola Barang</h2><div class="card"><p class="muted">Hanya Admin yang dapat mengubah master barang.</p><div class="tablewrap"><table><tr><th>Barang</th><th>Jual</th><th>Beli</th><th>Isi/Karton</th><th>Min.</th><th>Karton keluar</th><th>Aksi</th></tr>${products.map(p=>`<tr><td>${esc(p.nama)}</td><td>${money(p.harga_jual)}</td><td>${money(p.harga_beli)}</td><td>${p.isi_karton||'—'}</td><td>${p.minimum_stok}</td><td>${p.bisa_karton?'Ya':'Tidak'}</td><td><button onclick="editProduct('${p.id}')">✏️ Edit</button></td></tr>`).join('')}</table></div></div><div id="editBox" class="card hidden"></div>`}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const b=document.getElementById('editBox');b.classList.remove('hidden');b.innerHTML=`<h3>Edit: ${esc(p.nama)}</h3><label>Nama</label><input id="pn" value="${esc(p.nama)}"><label>Harga jual / pcs</label><input id="ps" type="number" min="0" value="${p.harga_jual??''}"><label>Harga beli / pcs</label><input id="pb" type="number" min="0" value="${p.harga_beli??''}"><label>Isi karton</label><input id="pc" type="number" min="1" value="${p.isi_karton??''}"><label>Minimum stok</label><input id="pm" type="number" min="0" value="${p.minimum_stok}"><label><input id="po" type="checkbox" style="width:auto" ${p.bisa_karton?'checked':''}> Boleh keluar/dijual sebagai karton</label><div style="margin-top:12px"><button onclick="saveProduct('${p.id}')">💾 Simpan</button> <button class="secondary" onclick="render()">Batal</button></div>`;b.scrollIntoView({behavior:'smooth'})}
async function saveProduct(id){const data={nama:pn.value.trim(),harga_jual:ps.value===''?null:Number(ps.value),harga_beli:pb.value===''?null:Number(pb.value),isi_karton:pc.value===''?null:Number(pc.value),minimum_stok:Number(pm.value||0),bisa_karton:po.checked,updated_at:new Date().toISOString()};if(!data.nama)return alert('Nama wajib diisi.');const {error}=await sb.from('products').update(data).eq('id',id);if(error)return alert(error.message);alert('Produk berhasil diperbarui.');render()}
boot();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
</body></html>
