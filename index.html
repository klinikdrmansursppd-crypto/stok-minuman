<!doctype html>
<html lang="id">
<head><meta name="app-version" content="2026-09-03-multi-stock-1">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json">
<title>Stok Minuman Online</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f6f7;color:#172126}header{background:#0f766e;color:white;padding:16px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:21px}.userbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:6px;font-size:13px}.userbar button{background:#fff;color:#0f766e;padding:7px 10px}nav{display:flex;gap:7px;overflow:auto;padding:10px;background:white;position:sticky;top:78px;z-index:4;border-bottom:1px solid #ddd}button{border:0;border-radius:10px;padding:10px 13px;background:#0f766e;color:#fff;font-weight:650;cursor:pointer}nav button{background:#e8eeee;color:#17403d;white-space:nowrap}nav button.active{background:#0f766e;color:white}main{padding:14px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.card,.form{background:white;border-radius:14px;padding:14px;box-shadow:0 1px 5px #0001;margin-bottom:14px}.big{font-size:24px;font-weight:800}table{width:100%;border-collapse:collapse;background:white}.tablewrap{overflow:auto;border-radius:12px}th,td{padding:10px;border-bottom:1px solid #e8eeee;text-align:left;white-space:nowrap}th{background:#edf4f3}input,select{width:100%;padding:10px;border:1px solid #cbd5d6;border-radius:9px;background:white}label{font-size:13px;font-weight:700;display:block;margin:8px 0 5px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.muted{color:#667}.low{color:#b42318;font-weight:700}.ok{color:#087443;font-weight:700}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.pill{padding:4px 8px;border-radius:20px;background:#e8eeee;font-size:12px}.danger{background:#b42318}.secondary{background:#e8eeee;color:#17403d}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:white;border-radius:18px;padding:22px;box-shadow:0 2px 12px #0002}.loginbox h1{margin-top:0}.hidden{display:none!important}.status{padding:10px;border-radius:10px;background:#eef7f6;margin-bottom:12px}.right{text-align:right}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><h1>📦 Stok Minuman</h1><p class="muted">Login Admin / Karyawan</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button style="width:100%;margin-top:14px">Masuk</button></form><p id="loginMsg" class="muted"></p></div></div>
<div id="appShell" class="hidden">
<header><h1>📦 Stok Minuman</h1><div class="userbar"><span id="userLine">Terhubung ke database online</span><button onclick="logout()">Keluar</button></div></header>
<nav id="nav"></nav><main id="app"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://dtkxqmieusoalgaqqvqg.supabase.co';
const SUPABASE_KEY='sb_publishable_mxwJCOFMQCyJuTBfcyW2wA_gGETE7YT';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentProfile=null,page='dashboard',products=[],stocks=[];
const navItems=[['dashboard','Dashboard'],['sale','Penjualan'],['in','Barang Masuk'],['move','Pindah Stok'],['out','Pengeluaran'],['stock','Stok'],['history','Riwayat'],['report','📊 Laporan Harian'],['produk','⚙️ Kelola Barang']];
const money=n=>n==null?'—':'Rp '+Number(n).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function stockOf(p,l){const x=stocks.find(s=>s.product_id===p.id&&s.lokasi===l);return x?Number(x.jumlah):0}
function totalOf(p){return stockOf(p,'gudang')+stockOf(p,'etalase')}
function opts(){return products.filter(p=>p.aktif).map(p=>`<option value="${p.id}">${esc(p.nama)}</option>`).join('')}
async function refreshData(){
 const [pr,st]=await Promise.all([sb.from('products').select('*').order('nama'),sb.from('stock').select('*')]);
 if(pr.error)throw pr.error;if(st.error)throw st.error;products=pr.data||[];stocks=st.data||[];
}
async function boot(){
 const {data:{session}}=await sb.auth.getSession(); if(session) await enterApp(session.user); else showLogin();
 sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT')showLogin();});
}
function showLogin(){document.getElementById('login').classList.remove('hidden');document.getElementById('appShell').classList.add('hidden')}
async function enterApp(user){
 currentUser=user;const r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
 if(r.error){alert(r.error.message);return}currentProfile=r.data;
 if(!currentProfile||!currentProfile.aktif){await sb.auth.signOut();alert('Akun tidak aktif.');return}
 await refreshData();document.getElementById('login').classList.add('hidden');document.getElementById('appShell').classList.remove('hidden');
 document.getElementById('userLine').textContent=`${currentProfile.nama} · ${currentProfile.role}`;render();
}
async function logout(){await sb.auth.signOut()}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('loginMsg');const emailEl=document.getElementById('email');const passwordEl=document.getElementById('password');msg.textContent='Memeriksa login...';const {data,error}=await sb.auth.signInWithPassword({email:emailEl.value.trim(),password:passwordEl.value});if(error){msg.textContent='Login gagal: '+error.message;return;}if(data?.user){try{await enterApp(data.user);msg.textContent='';}catch(err){msg.textContent='Gagal membuka aplikasi: '+err.message;}}});
function renderNav(){document.getElementById('nav').innerHTML=navItems.filter(x=>x[0]!=='produk'||currentProfile?.role==='admin').map(x=>`<button class="${page===x[0]?'active':''}" onclick="page='${x[0]}';render()">${x[1]}</button>`).join('')}
async function render(){renderNav();let a=document.getElementById('app');try{await refreshData();if(page==='dashboard')a.innerHTML=dashboard();if(page==='stock')a.innerHTML=stock();if(page==='sale')a.innerHTML=sale();if(page==='in')a.innerHTML=inPage();if(page==='move')a.innerHTML=move();if(page==='out')a.innerHTML=outPage();if(page==='history')a.innerHTML=await history();if(page==='report')a.innerHTML=await reportPage();if(page==='produk')a.innerHTML=productPage();if(page==='dashboard')await loadOmzet(new Date().toISOString().slice(0,10));if(page==='sale')addSaleRow();if(page==='in')addInRow();if(page==='move')addMoveRow();if(page==='out')addOutRow();}catch(e){a.innerHTML=`<div class="card"><b>Gagal memuat data</b><p>${esc(e.message)}</p></div>`}}
function dashboard(){return `<h2>Dashboard</h2><div class="grid"><div class="card"><small>Omzet hari ini</small><div class="big" id="omzet">Memuat...</div></div><div class="card"><small>Total jenis barang</small><div class="big">${products.filter(p=>p.aktif).length}</div></div><div class="card"><small>Total unit stok</small><div class="big">${products.reduce((x,p)=>x+totalOf(p),0)}</div></div><div class="card"><small>Stok menipis</small><div class="big low">${products.filter(p=>p.aktif&&totalOf(p)<=p.minimum_stok).length}</div></div></div><div class="card"><b>Stok menipis</b>${products.filter(p=>p.aktif&&totalOf(p)<=p.minimum_stok).map(p=>`<div class="item"><span>${esc(p.nama)}</span><b>${totalOf(p)}</b></div>`).join('')||'<p class="muted">Tidak ada.</p>'}</div>`}
async function loadOmzet(today){const from=today+'T00:00:00';const {data,error}=await sb.from('sales').select('total,created_at').eq('status','aktif').gte('created_at',from);const el=document.getElementById('omzet');if(el)el.textContent=error?'—':money((data||[]).reduce((s,x)=>s+Number(x.total),0))}
function stock(){return `<h2>Stok</h2><div class="tablewrap"><table><tr><th>Barang</th><th>Gudang</th><th>Etalase</th><th>Total</th><th>Satuan</th><th>Status</th></tr>${products.filter(p=>p.aktif).map(p=>{let t=totalOf(p);return `<tr><td>${esc(p.nama)}</td><td>${stockOf(p,'gudang')}</td><td>${stockOf(p,'etalase')}</td><td><b>${t}</b></td><td>${p.isi_karton?`1 karton=${p.isi_karton} pcs`:'pcs'}</td><td>${t<=p.minimum_stok?'<span class="low">Menipis</span>':'<span class="ok">Aman</span>'}</td></tr>`}).join('')}</table></div>`}
function sale(){return `<h2>Penjualan / Buat Nota</h2><div class="form"><div class="row"><div><label>Nomor nota</label><input id="sn" placeholder="Otomatis jika dikosongkan"></div></div><h3>Daftar Barang</h3><div id="saleRows"></div><button type="button" onclick="addSaleRow()">➕ Tambah Barang</button><div class="card" style="margin-top:12px;background:#f7faf9"><div class="item"><span>Total Nota</span><b id="saleTotal">Rp 0</b></div></div><p class="muted">Satu nota dapat berisi banyak barang. Setiap barang bisa dipilih dari Etalase/Gudang dan Pcs/Karton.</p><button onclick="doSaleMulti()">💾 Simpan Nota</button></div>`}
function saleRowHtml(i){return `<div class="card sale-row" id="saleRow${i}"><div class="row"><div><label>Barang</label><select class="sr-product" onchange="updateSaleTotal()">${opts()}</select></div><div><label>Sumber stok</label><select class="sr-source" onchange="updateSaleTotal()"><option value="etalase">Etalase</option><option value="gudang">Gudang</option></select></div><div><label>Satuan</label><select class="sr-unit" onchange="updateSaleTotal()"><option value="pcs">Pcs</option><option value="carton">Karton</option></select></div><div><label>Jumlah</label><input class="sr-qty" type="number" min="1" value="1" oninput="updateSaleTotal()"></div></div><div class="item"><span class="sr-info muted">Harga: —</span><button type="button" class="danger" onclick="removeSaleRow(${i})">Hapus</button></div></div>`}
let saleRowNo=0;
function addSaleRow(){const box=document.getElementById('saleRows');if(!box)return;const i=saleRowNo++;box.insertAdjacentHTML('beforeend',saleRowHtml(i));updateSaleTotal()}
function removeSaleRow(i){const el=document.getElementById('saleRow'+i);if(el)el.remove();if(!document.querySelector('.sale-row'))addSaleRow();updateSaleTotal()}
function updateSaleTotal(){let total=0;document.querySelectorAll('.sale-row').forEach(r=>{const p=products.find(x=>x.id===r.querySelector('.sr-product')?.value),q=Number(r.querySelector('.sr-qty')?.value||0),unit=r.querySelector('.sr-unit')?.value;const n=unit==='carton'?q*Number(p?.isi_karton||0):q;const info=r.querySelector('.sr-info');if(info)info.textContent=p?`Harga ${money(p.harga_jual)} / pcs · Stok ${stockOf(p,r.querySelector('.sr-source').value)} pcs`: 'Harga: —';if(p&&p.harga_jual!=null&&n>0)total+=n*Number(p.harga_jual)});const el=document.getElementById('saleTotal');if(el)el.textContent=money(total)}
async function doSaleMulti(){const rows=[...document.querySelectorAll('.sale-row')];const items=[];const used=new Set();for(const r of rows){const p=products.find(x=>x.id===r.querySelector('.sr-product')?.value),loc=r.querySelector('.sr-source').value,unit=r.querySelector('.sr-unit').value,q=Number(r.querySelector('.sr-qty').value),n=unit==='carton'?q*Number(p?.isi_karton||0):q;if(!p||q<1||n<1||n>stockOf(p,loc))return alert(`Stok tidak cukup untuk ${p?.nama||'barang'} di ${loc}.`);if(p.harga_jual==null)return alert(`Harga jual ${p.nama} belum diisi.`);const key=p.id+'|'+loc;if(used.has(key))return alert(`Barang ${p.nama} dari ${loc} sudah ada di nota. Gabungkan jumlahnya pada baris tersebut.`);used.add(key);items.push({product_id:p.id,sumber:loc,jumlah_pcs:n,mode:unit,jumlah_input:q,harga:Number(p.harga_jual)})}if(!items.length)return alert('Tambahkan minimal 1 barang.');const nota=document.getElementById('sn').value.trim()||('NOTA-'+Date.now());const {error}=await sb.rpc('record_sale_multi',{p_nomor_nota:nota,p_items:items});if(error)return alert(error.message);alert(`Nota ${nota} tersimpan dengan ${items.length} barang.`);page='history';render()}
function inPage(){return `<h2>Barang Masuk</h2><div class="form"><div class="row"><div><label>Supplier (opsional)</label><input id="isup" placeholder="Nama supplier"></div></div><h3>Daftar Barang</h3><div id="inRows"></div><button type="button" onclick="addInRow()">➕ Tambah Barang</button><p class="muted">Semua barang masuk dari supplier otomatis masuk Gudang.</p><button onclick="doInMulti()">💾 Simpan Barang Masuk</button></div>`}
let inRowNo=0;
function inRowHtml(i){return `<div class="card in-row" id="inRow${i}"><div class="row"><div><label>Barang</label><select class="ir-product">${opts()}</select></div><div><label>Jumlah</label><input class="ir-qty" type="number" min="1" value="1"></div><div><label>Satuan</label><select class="ir-unit"><option value="carton">Karton</option><option value="pcs">Pcs</option></select></div></div><div style="margin-top:8px;text-align:right"><button type="button" class="danger" onclick="removeInRow(${i})">Hapus</button></div></div>`}
function addInRow(){const box=document.getElementById('inRows');if(!box)return;const i=inRowNo++;box.insertAdjacentHTML('beforeend',inRowHtml(i))}
function removeInRow(i){const e=document.getElementById('inRow'+i);if(e)e.remove();if(!document.querySelector('.in-row'))addInRow()}
async function doInMulti(){const items=[...document.querySelectorAll('.in-row')].map(r=>({product_id:r.querySelector('.ir-product').value,jumlah_input:Number(r.querySelector('.ir-qty').value),mode:r.querySelector('.ir-unit').value}));if(!items.length)return alert('Tambahkan minimal 1 barang.');if(items.some(x=>!x.product_id||x.jumlah_input<1))return alert('Jumlah harus lebih dari 0.');const {error}=await sb.rpc('record_incoming_multi',{p_supplier:document.getElementById('isup').value.trim()||null,p_items:items});if(error)return alert('Gagal menyimpan barang masuk: '+error.message);alert(`Barang masuk tersimpan (${items.length} barang).`);render()}
function move(){return `<h2>Pindah Stok</h2><div class="form"><div class="row"><div><label>Dari</label><select id="mf"><option value="gudang">Gudang</option><option value="etalase">Etalase</option></select></div><div><label>Ke</label><select id="mt"><option value="etalase">Etalase</option><option value="gudang">Gudang</option></select></div></div><h3>Daftar Barang</h3><div id="moveRows"></div><button type="button" onclick="addMoveRow()">➕ Tambah Barang</button><button style="margin-top:10px" onclick="doMoveMulti()">💾 Pindahkan Semua</button></div>`}
let moveRowNo=0;
function moveRowHtml(i){return `<div class="card move-row" id="moveRow${i}"><div class="row"><div><label>Barang</label><select class="mr-product">${opts()}</select></div><div><label>Jumlah pcs</label><input class="mr-qty" type="number" min="1" value="1"></div></div><div style="margin-top:8px;text-align:right"><button type="button" class="danger" onclick="removeMoveRow(${i})">Hapus</button></div></div>`}
function addMoveRow(){const box=document.getElementById('moveRows');if(!box)return;const i=moveRowNo++;box.insertAdjacentHTML('beforeend',moveRowHtml(i))}
function removeMoveRow(i){const e=document.getElementById('moveRow'+i);if(e)e.remove();if(!document.querySelector('.move-row'))addMoveRow()}
async function doMoveMulti(){const dari=document.getElementById('mf').value,ke=document.getElementById('mt').value;const items=[...document.querySelectorAll('.move-row')].map(r=>({product_id:r.querySelector('.mr-product').value,jumlah_pcs:Number(r.querySelector('.mr-qty').value)}));if(dari===ke)return alert('Lokasi asal dan tujuan harus berbeda.');if(!items.length)return alert('Tambahkan minimal 1 barang.');for(const x of items){const p=products.find(y=>y.id===x.product_id);if(!p||x.jumlah_pcs<1||x.jumlah_pcs>stockOf(p,dari))return alert(`Stok ${p?.nama||'barang'} di ${dari} tidak cukup.`)}const {error}=await sb.rpc('record_transfer_multi',{p_dari:dari,p_ke:ke,p_items:items});if(error)return alert('Gagal memindahkan stok: '+error.message);alert(`Pindah stok berhasil (${items.length} barang).`);render()}
function outPage(){return `<h2>Pengeluaran Barang (Tanpa Penjualan)</h2><div class="form"><div class="row"><div><label>Dari</label><select id="ol"><option value="gudang">Gudang</option><option value="etalase">Etalase</option></select></div><div><label>Alasan</label><select id="or"><option>Diambil Owner</option><option>Gratis / Giveaway</option><option>Dipakai Sendiri</option><option>Rusak</option><option>Lainnya</option></select></div></div><label>Keterangan</label><input id="oket" placeholder="Opsional"><h3>Daftar Barang</h3><div id="outRows"></div><button type="button" onclick="addOutRow()">➕ Tambah Barang</button><p class="muted">Tidak dihitung sebagai omzet.</p><button onclick="doOutMulti()">💾 Simpan Pengeluaran</button></div>`}
let outRowNo=0;
function outRowHtml(i){return `<div class="card out-row" id="outRow${i}"><div class="row"><div><label>Barang</label><select class="or-product">${opts()}</select></div><div><label>Jumlah pcs</label><input class="or-qty" type="number" min="1" value="1"></div></div><div style="margin-top:8px;text-align:right"><button type="button" class="danger" onclick="removeOutRow(${i})">Hapus</button></div></div>`}
function addOutRow(){const box=document.getElementById('outRows');if(!box)return;const i=outRowNo++;box.insertAdjacentHTML('beforeend',outRowHtml(i))}
function removeOutRow(i){const e=document.getElementById('outRow'+i);if(e)e.remove();if(!document.querySelector('.out-row'))addOutRow()}
async function doOutMulti(){const sumber=document.getElementById('ol').value,alasan=document.getElementById('or').value,keterangan=document.getElementById('oket').value.trim()||null;const items=[...document.querySelectorAll('.out-row')].map(r=>({product_id:r.querySelector('.or-product').value,jumlah_pcs:Number(r.querySelector('.or-qty').value)}));if(!items.length)return alert('Tambahkan minimal 1 barang.');for(const x of items){const p=products.find(y=>y.id===x.product_id);if(!p||x.jumlah_pcs<1||x.jumlah_pcs>stockOf(p,sumber))return alert(`Stok ${p?.nama||'barang'} di ${sumber} tidak cukup.`)}const {error}=await sb.rpc('record_issue_multi',{p_sumber:sumber,p_alasan:alasan,p_keterangan:keterangan,p_items:items});if(error)return alert('Gagal menyimpan pengeluaran: '+error.message);alert(`Pengeluaran tersimpan (${items.length} barang).`);render()}
async function reportPage(){
  const today=new Date().toISOString().slice(0,10);
  return `<h2>📊 Laporan Harian</h2><div class="form"><div class="row"><div><label>Tanggal laporan</label><input id="rd" type="date" value="${today}"></div><div style="display:flex;align-items:end;gap:8px"><button onclick="loadReport()">Tampilkan</button><button class="secondary" onclick="printReport()">🖨️ Cetak</button></div></div></div><div id="reportBox"><div class="card muted">Memuat laporan...</div></div><div id="printArea" class="hidden"></div><script>setTimeout(loadReport,0)<\/script>`
}
async function loadReport(){
  const d=document.getElementById('rd')?.value;if(!d)return;
  const from=d+'T00:00:00', to=d+'T23:59:59.999';
  const [s,i,o,t]=await Promise.all([
    sb.from('sales').select('id,nomor_nota,total,created_at,sumber,status,sale_items(jumlah_pcs,jumlah_input,mode,harga,subtotal,products(nama))').eq('status','aktif').gte('created_at',from).lte('created_at',to).order('created_at',{ascending:true}),
    sb.from('incoming').select('id,supplier,created_at,incoming_items(jumlah_pcs,jumlah_input,mode,products(nama))').gte('created_at',from).lte('created_at',to).order('created_at',{ascending:true}),
    sb.from('stock_issues').select('id,sumber,alasan,keterangan,created_at,stock_issue_items(jumlah_pcs,products(nama))').gte('created_at',from).lte('created_at',to).order('created_at',{ascending:true}),
    sb.from('stock_transfers').select('id,dari,ke,created_at,stock_transfer_items(jumlah_pcs,products(nama))').gte('created_at',from).lte('created_at',to).order('created_at',{ascending:true})
  ]);
  const err=[s,i,o,t].find(x=>x.error);if(err){document.getElementById('reportBox').innerHTML=`<div class="card"><b>Gagal memuat laporan</b><p>${esc(err.error.message)}</p></div>`;return;}
  const sales=s.data||[], ins=i.data||[], outs=o.data||[], moves=t.data||[];
  const omzet=sales.reduce((a,x)=>a+Number(x.total||0),0), nota=sales.length;
  const sold=sales.reduce((a,x)=>a+(x.sale_items||[]).reduce((b,y)=>b+Number(y.jumlah_pcs||0),0),0);
  const incomingPcs=ins.reduce((a,x)=>a+(x.incoming_items||[]).reduce((b,y)=>b+Number(y.jumlah_pcs||0),0),0);
  const outPcs=outs.reduce((a,x)=>a+(x.stock_issue_items||[]).reduce((b,y)=>b+Number(y.jumlah_pcs||0),0),0);
  const movePcs=moves.reduce((a,x)=>a+(x.stock_transfer_items||[]).reduce((b,y)=>b+Number(y.jumlah_pcs||0),0),0);
  const box=document.getElementById('reportBox');
  box.innerHTML=`<div class="grid"><div class="card"><small>Jumlah Nota</small><div class="big">${nota}</div></div><div class="card"><small>Barang Terjual</small><div class="big">${sold} pcs</div></div><div class="card"><small>Omzet Penjualan</small><div class="big">${money(omzet)}</div></div><div class="card"><small>Barang Masuk</small><div class="big">${incomingPcs} pcs</div></div><div class="card"><small>Pengeluaran Non-Penjualan</small><div class="big">${outPcs} pcs</div></div><div class="card"><small>Pindah Stok</small><div class="big">${movePcs} pcs</div></div></div><div class="card"><h3>Rincian Penjualan</h3>${sales.map(x=>`<div class="item"><div><b>${esc(x.nomor_nota)}</b><br><small>${new Date(x.created_at).toLocaleTimeString('id-ID')} · ${esc(x.sumber)}</small><br>${(x.sale_items||[]).map(y=>`${esc(y.products?.nama||'-')} ${y.jumlah_pcs} pcs`).join(', ')}</div><b>${money(x.total)}</b></div>`).join('')||'<p class="muted">Tidak ada penjualan.</p>'}</div><div class="card"><h3>Barang Masuk</h3>${ins.map(x=>`<div class="item"><div><b>${esc(x.supplier||'-')}</b><br><small>${new Date(x.created_at).toLocaleTimeString('id-ID')}</small><br>${(x.incoming_items||[]).map(y=>`${esc(y.products?.nama||'-')} ${y.jumlah_pcs} pcs`).join(', ')}</div></div>`).join('')||'<p class="muted">Tidak ada.</p>'}</div><div class="card"><h3>Pengeluaran Non-Penjualan</h3>${outs.map(x=>`<div class="item"><div><b>${esc(x.alasan)}</b> · ${esc(x.sumber)}<br><small>${new Date(x.created_at).toLocaleTimeString('id-ID')}</small><br>${(x.stock_issue_items||[]).map(y=>`${esc(y.products?.nama||'-')} ${y.jumlah_pcs} pcs`).join(', ')}${x.keterangan?`<br>${esc(x.keterangan)}`:''}</div></div>`).join('')||'<p class="muted">Tidak ada.</p>'}</div>`;
  document.getElementById('printArea').innerHTML=`<div><h2 style="text-align:center">LAPORAN HARIAN</h2><p style="text-align:center">Tanggal: ${d}</p><hr><p>Jumlah Nota: <b>${nota}</b></p><p>Barang Terjual: <b>${sold} pcs</b></p><p>Omzet: <b>${money(omzet)}</b></p><p>Barang Masuk: <b>${incomingPcs} pcs</b></p><p>Pengeluaran Non-Penjualan: <b>${outPcs} pcs</b></p><h3>Rincian Penjualan</h3>${sales.map(x=>`<p>${esc(x.nomor_nota)} — ${new Date(x.created_at).toLocaleTimeString('id-ID')} — ${money(x.total)}<br>${(x.sale_items||[]).map(y=>`${esc(y.products?.nama||'-')} ${y.jumlah_pcs} pcs`).join(', ')}</p>`).join('')||'<p>Tidak ada penjualan.</p>'}</div>`;
}
function printReport(){const p=document.getElementById('printArea');if(!p||!p.innerHTML){return alert('Tampilkan laporan terlebih dahulu.');}const w=window.open('','_blank');if(!w)return alert('Popup diblokir. Izinkan popup untuk mencetak.');w.document.write(`<html><head><title>Laporan Harian</title><style>body{font-family:Arial,sans-serif;padding:24px}hr{border:0;border-top:1px solid #ccc}h2{text-align:center}</style></head><body>${p.innerHTML}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300);}
function printSale(id){const sale=(window.__sales||[]).find(x=>x.id===id);if(!sale)return alert('Nota tidak ditemukan.');const items=sale.sale_items||[];const w=window.open('','_blank');if(!w)return alert('Popup diblokir. Izinkan popup untuk mencetak.');w.document.write(`<html><head><title>Nota ${esc(sale.nomor_nota)}</title><style>body{font-family:Arial,sans-serif;width:80mm;margin:auto;padding:10px;font-size:12px}.center{text-align:center}.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed #bbb}.total{font-size:16px;font-weight:bold;border-top:1px solid #222;margin-top:6px;padding-top:8px}.small{font-size:10px;color:#555}</style></head><body><div class="center"><h2 style="margin:0 0 5px">NOTA PENJUALAN</h2><div>${esc(sale.nomor_nota)}</div><div class="small">${new Date(sale.created_at).toLocaleString('id-ID')}</div></div><hr>${items.map(y=>`<div class="row"><div>${esc(y.products?.nama||'-')}<br><span class="small">${y.jumlah_input||y.jumlah_pcs} ${y.mode==='carton'?'karton':'pcs'} × ${money(y.harga)}</span></div><b>${money(y.subtotal)}</b></div>`).join('')}<div class="row total"><span>TOTAL</span><span>${money(sale.total)}</span></div><p class="center small">Terima kasih</p></body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)}
async function cancelSale(id){if(currentProfile?.role!=='admin')return alert('Hanya Admin yang dapat membatalkan nota.');const sale=(window.__sales||[]).find(x=>x.id===id);if(!sale)return alert('Nota tidak ditemukan. Silakan refresh Riwayat.');const ok=confirm(`Batalkan nota ${sale.nomor_nota}?\n\nStok barang akan dikembalikan dan omzet nota dibatalkan.`);if(!ok)return;const {data,error}=await sb.rpc('cancel_sale',{p_sale_id:id});if(error)return alert('Gagal membatalkan nota: '+error.message);if(data===false)return alert('Nota sudah dibatalkan atau tidak dapat dibatalkan.');alert(`Nota ${sale.nomor_nota} berhasil dibatalkan.`);await render()}
async function cancelIncoming(id){if(currentProfile?.role!=='admin')return alert('Hanya Admin yang dapat membatalkan aktivitas.');if(!confirm('Batalkan Barang Masuk ini?\nStok yang masuk akan dikurangi kembali dari Gudang.'))return;const {error}=await sb.rpc('cancel_incoming',{p_id:id});if(error)return alert(error.message);alert('Barang Masuk berhasil dibatalkan.');render()}
async function cancelTransfer(id){if(currentProfile?.role!=='admin')return alert('Hanya Admin yang dapat membatalkan aktivitas.');if(!confirm('Batalkan Pindah Stok ini?\nStok akan dikembalikan ke lokasi sebelum perpindahan.'))return;const {error}=await sb.rpc('cancel_transfer',{p_id:id});if(error)return alert(error.message);alert('Pindah Stok berhasil dibatalkan.');render()}
async function cancelIssue(id){if(currentProfile?.role!=='admin')return alert('Hanya Admin yang dapat membatalkan aktivitas.');if(!confirm('Batalkan Pengeluaran ini?\nBarang akan dikembalikan ke lokasi asal.'))return;const {error}=await sb.rpc('cancel_issue',{p_id:id});if(error)return alert(error.message);alert('Pengeluaran berhasil dibatalkan.');render()}
async function history(){const [s,i,t,o]=await Promise.all([sb.from('sales').select('*,sale_items(*,products!sale_items_product_id_fkey(nama))').order('created_at',{ascending:false}).limit(50),sb.from('incoming').select('*,incoming_items(*,products!incoming_items_product_id_fkey(nama))').order('created_at',{ascending:false}).limit(50),sb.from('stock_transfers').select('*,stock_transfer_items(*,products!stock_transfer_items_product_id_fkey(nama))').order('created_at',{ascending:false}).limit(50),sb.from('stock_issues').select('*,stock_issue_items(*,products!stock_issue_items_product_id_fkey(nama))').order('created_at',{ascending:false}).limit(50)]);if(s.error)return `<div class="card"><b>Gagal memuat riwayat</b><p>${esc(s.error.message)}</p></div>`;window.__sales=s.data||[];const salesHtml=(s.data||[]).map(x=>`<div class="item"><div style="flex:1"><b>Nota ${esc(x.nomor_nota)}</b> ${x.status==='dibatalkan'?'<span class="pill">DIBATALKAN</span>':''}<br><small>${new Date(x.created_at).toLocaleString('id-ID')}</small><br>${(x.sale_items||[]).map(y=>`${esc(y.products?.nama||'-')} ${y.jumlah_input||y.jumlah_pcs} ${y.mode==='carton'?'karton':'pcs'}`).join(', ')}<br><b>${money(x.total)}</b></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${x.status!=='dibatalkan'?`<button type="button" onclick="printSale('${x.id}')">🖨️ Print Nota</button>`:''}${x.status!=='dibatalkan'&&currentProfile?.role==='admin'?`<button type="button" class="danger" onclick="cancelSale('${x.id}')">↩️ Batalkan Nota</button>`:''}</div></div>`).join('')||'<p class="muted">Belum ada penjualan.</p>';
const incomingHtml=(i.data||[]).map(x=>`<div class="item"><div style="flex:1"><b>Barang Masuk</b> ${x.status==='dibatalkan'?'<span class="pill">DIBATALKAN</span>':''}<br><small>${new Date(x.created_at).toLocaleString('id-ID')}</small><br>Supplier: ${esc(x.supplier||'-')}<br>${(x.incoming_items||[]).map(y=>`${esc(y.products?.nama||'-')} ${y.jumlah_pcs} pcs`).join(', ')}</div>${x.status!=='dibatalkan'&&currentProfile?.role==='admin'?`<button type="button" class="danger" onclick="cancelIncoming('${x.id}')">↩️ Batalkan</button>`:''}</div>`).join('')||'<p class="muted">Belum ada barang masuk.</p>';
const transferHtml=(t.data||[]).map(x=>`<div class="item"><div style="flex:1"><b>Pindah Stok</b> ${x.status==='dibatalkan'?'<span class="pill">DIBATALKAN</span>':''}<br><small>${new Date(x.created_at).toLocaleString('id-ID')}</small><br>${esc(x.dari)} → ${esc(x.ke)}<br>${(x.stock_transfer_items||[]).map(y=>`${esc(y.products?.nama||'-')} ${y.jumlah_pcs} pcs`).join(', ')}</div>${x.status!=='dibatalkan'&&currentProfile?.role==='admin'?`<button type="button" class="danger" onclick="cancelTransfer('${x.id}')">↩️ Batalkan</button>`:''}</div>`).join('')||'<p class="muted">Belum ada perpindahan.</p>';
const issueHtml=(o.data||[]).map(x=>`<div class="item"><div style="flex:1"><b>Pengeluaran</b> ${x.status==='dibatalkan'?'<span class="pill">DIBATALKAN</span>':''}<br><small>${new Date(x.created_at).toLocaleString('id-ID')}</small><br>${esc(x.alasan)} · ${esc(x.sumber)}${x.keterangan?` · ${esc(x.keterangan)}`:''}<br>${(x.stock_issue_items||[]).map(y=>`${esc(y.products?.nama||'-')} ${y.jumlah_pcs} pcs`).join(', ')}</div>${x.status!=='dibatalkan'&&currentProfile?.role==='admin'?`<button type="button" class="danger" onclick="cancelIssue('${x.id}')">↩️ Batalkan</button>`:''}</div>`).join('')||'<p class="muted">Belum ada pengeluaran.</p>';
return `<h2>Riwayat Aktivitas</h2><div id="salePrintData" class="hidden" data-sales='${esc(JSON.stringify(s.data||[]))}'></div><div class="card"><h3>Riwayat Penjualan</h3>${salesHtml}</div><div class="card"><h3>Barang Masuk</h3>${incomingHtml}</div><div class="card"><h3>Pindah Stok</h3>${transferHtml}</div><div class="card"><h3>Pengeluaran Non-Penjualan</h3>${issueHtml}</div>`}
function productPage(){if(currentProfile?.role!=='admin')return '<div class="card"><b>Akses ditolak.</b></div>';return `<h2>⚙️ Kelola Barang</h2><div class="card"><div class="item"><p class="muted">Kelola daftar barang dan tambahkan produk baru.</p><button type="button" onclick="showAddProduct()">➕ Tambah Barang</button></div><div class="tablewrap"><table><tr><th>Barang</th><th>Jual</th><th>Beli</th><th>Isi/Karton</th><th>Min.</th><th>Karton keluar</th><th>Aksi</th></tr>${products.map(p=>`<tr><td>${esc(p.nama)}</td><td>${money(p.harga_jual)}</td><td>${money(p.harga_beli)}</td><td>${p.isi_karton||'—'}</td><td>${p.minimum_stok}</td><td>${p.bisa_karton?'Ya':'Tidak'}</td><td><button type="button" onclick="editProduct('${p.id}')">✏️ Edit</button></td></tr>`).join('')}</table></div></div><div id="editBox" class="card hidden"></div>`}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const b=document.getElementById('editBox');b.classList.remove('hidden');b.innerHTML=`<h3>Edit: ${esc(p.nama)}</h3><label>Nama</label><input id="pn" value="${esc(p.nama)}"><label>Harga jual / pcs</label><input id="ps" type="number" min="0" value="${p.harga_jual??''}"><label>Harga beli / pcs</label><input id="pb" type="number" min="0" value="${p.harga_beli??''}"><label>Isi karton</label><input id="pc" type="number" min="1" value="${p.isi_karton??''}"><label>Minimum stok</label><input id="pm" type="number" min="0" value="${p.minimum_stok}"><label><input id="po" type="checkbox" style="width:auto" ${p.bisa_karton?'checked':''}> Boleh keluar/dijual sebagai karton</label><div style="margin-top:12px"><button onclick="saveProduct('${p.id}')">💾 Simpan</button> <button class="secondary" onclick="render()">Batal</button></div>`;b.scrollIntoView({behavior:'smooth'})}

function showAddProduct(){const b=document.getElementById('editBox');b.classList.remove('hidden');b.innerHTML=`<h3>Tambah Barang Baru</h3><label>Nama barang</label><input id="pn" placeholder="Contoh: Teh Botol"><label>Harga jual / pcs</label><input id="ps" type="number" min="0"><label>Harga beli / pcs</label><input id="pb" type="number" min="0"><label>Isi karton</label><input id="pc" type="number" min="1" placeholder="Kosongkan jika tidak ada"><label>Minimum stok</label><input id="pm" type="number" min="0" value="10"><label><input id="po" type="checkbox" style="width:auto"> Boleh keluar/dijual sebagai karton</label><div style="margin-top:12px"><button type="button" onclick="createProduct()">💾 Simpan Barang</button> <button type="button" class="secondary" onclick="render()">Batal</button></div>`;b.scrollIntoView({behavior:'smooth'})}
async function createProduct(){const data={nama:pn.value.trim(),harga_jual:ps.value===''?null:Number(ps.value),harga_beli:pb.value===''?null:Number(pb.value),isi_karton:pc.value===''?null:Number(pc.value),minimum_stok:Number(pm.value||0),bisa_karton:po.checked,aktif:true};if(!data.nama)return alert('Nama wajib diisi.');const {data:p,error}=await sb.from('products').insert(data).select().single();if(error)return alert(error.message);await sb.from('stock').insert([{product_id:p.id,lokasi:'gudang',jumlah:0},{product_id:p.id,lokasi:'etalase',jumlah:0}]);alert('Barang berhasil ditambahkan.');render()}
async function saveProduct(id){const data={nama:pn.value.trim(),harga_jual:ps.value===''?null:Number(ps.value),harga_beli:pb.value===''?null:Number(pb.value),isi_karton:pc.value===''?null:Number(pc.value),minimum_stok:Number(pm.value||0),bisa_karton:po.checked,updated_at:new Date().toISOString()};if(!data.nama)return alert('Nama wajib diisi.');const {error}=await sb.from('products').update(data).eq('id',id);if(error)return alert(error.message);alert('Produk berhasil diperbarui.');render()}
boot();
</script>
